name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-cs-fixer

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    needs: php-cs-fixer
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
        typo3-version: ['^12.4', '^13.4', '^14.0']
        exclude:
          # TYPO3 13 requires PHP 8.2+
          - php-version: '8.1'
            typo3-version: '^13.4'
          # TYPO3 14 requires PHP 8.3+
          - php-version: '8.1'
            typo3-version: '^14.0'
          - php-version: '8.2'
            typo3-version: '^14.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-phpstan-${{ matrix.php-version }}-${{ matrix.typo3-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-phpstan-${{ matrix.php-version }}-${{ matrix.typo3-version }}-
            ${{ runner.os }}-composer-

      - name: Remove incompatible dev dependencies for TYPO3 14
        if: matrix.typo3-version == '^14.0'
        run: composer remove --dev --no-update saschaegerer/phpstan-typo3

      - name: Install dependencies
        run: |
          composer config allow-plugins.typo3/class-alias-loader true
          composer config allow-plugins.typo3/cms-composer-installers true
          composer require --no-update typo3/cms-core:${{ matrix.typo3-version }} typo3/cms-backend:${{ matrix.typo3-version }} typo3/cms-dashboard:${{ matrix.typo3-version }}
          composer install --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --level=8 --configuration=phpstan.neon

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: phpstan
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
        typo3-version: ['^12.4', '^13.4', '^14.0']
        exclude:
          # TYPO3 13 requires PHP 8.2+
          - php-version: '8.1'
            typo3-version: '^13.4'
          # TYPO3 14 requires PHP 8.3+
          - php-version: '8.1'
            typo3-version: '^14.0'
          - php-version: '8.2'
            typo3-version: '^14.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-tests-${{ matrix.php-version }}-${{ matrix.typo3-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-tests-${{ matrix.php-version }}-${{ matrix.typo3-version }}-
            ${{ runner.os }}-composer-

      - name: Remove incompatible dev dependencies for TYPO3 14
        if: matrix.typo3-version == '^14.0'
        run: composer remove --dev --no-update saschaegerer/phpstan-typo3

      - name: Install dependencies
        run: |
          composer config allow-plugins.typo3/class-alias-loader true
          composer config allow-plugins.typo3/cms-composer-installers true
          composer require --no-update typo3/cms-core:${{ matrix.typo3-version }} typo3/cms-backend:${{ matrix.typo3-version }} typo3/cms-dashboard:${{ matrix.typo3-version }}
          composer install --no-progress --no-interaction

      - name: Run Unit Tests
        run: vendor/bin/phpunit --configuration=phpunit.xml

  vendor-version-check:
    name: Vendor Version Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for force-graph updates
        run: |
          CURRENT=$(head -1 Resources/Public/JavaScript/Vendor/force-graph.min.js | grep -oP 'Version \K[0-9]+\.[0-9]+\.[0-9]+')
          LATEST=$(curl -fsSL https://registry.npmjs.org/force-graph/latest | grep -oP '"version":"\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "Current: ${CURRENT}"
          echo "Latest:  ${LATEST}"
          if [[ "$CURRENT" != "$LATEST" ]]; then
            echo "::notice::force-graph update available: ${CURRENT} → ${LATEST}. Run: bash Build/update-vendor.sh"
          else
            echo "force-graph is up to date."
          fi
